<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>GossensBesterMann</title>
<meta name="description" content="Karteikarten für die Abschlussprüfung – offline lernen mit Fächer-System.">
<meta name="theme-color" content="#F2F2F7">
<script>
  // Design vor dem ersten Zeichnen setzen (kein Aufblitzen)
  (function () {
    var t = 'system';
    try { t = (JSON.parse(localStorage.getItem('karteikarten-ap2')) || {}).settings.theme || 'system'; } catch (e) {}
    var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.querySelector('meta[name="theme-color"]').content = dark ? '#000000' : '#F2F2F7';
  })();
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GossensBesterMann">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/app-icon-v2-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/app-icon-v2-apple-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <section class="view" id="view-learn" data-tab="learn"></section>
  <section class="view" id="view-cards" data-tab="cards"></section>
  <section class="view" id="view-categories" data-tab="categories"></section>
  <section class="view" id="view-stats" data-tab="stats"></section>
  <section class="view" id="view-settings" data-tab="settings"></section>
  <nav class="tabbar" id="tabbar" role="tablist"></nav>
  <div class="select-bar" id="select-bar"></div>
</div>
<div id="overlays"></div>
<div id="toast-host" aria-live="polite"></div>
<input type="file" id="file-input" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body>
</html>
